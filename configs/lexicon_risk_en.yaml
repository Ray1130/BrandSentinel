version: 1
language: en
negation_window_tokens: 3

# Các từ/cụm từ phủ định (negators)
negators:
  - "no"
  - "not"
  - "never"
  - "none"
  - "without"
  - "zero"
  - "neither"
  - "nor"
  - "hardly"
  - "scarcely"
  - "n't"
  - "cannot"
  - "cant"
  - "wont"
  - "dont"
  - "didnt"
  - "wasnt"
  - "isnt"
  - "arent"

# Ngữ cảnh loại trừ (tên sản phẩm, thương hiệu, thành ngữ thông dụng không mang nghĩa rủi ro)
exclude_contexts:
  - "fire tv stick"
  - "fire tv"
  - "fire stick"
  - "fire hd"
  - "kindle fire"
  - "amazon fire"
  - "fire sale"
  - "fire department"
  - "fire drill"
  - "fire pit"
  - "fireplace"
  - "fire place"
  - "fire truck"
  - "fire engine"
  - "fire extinguisher"
  - "hot deal"
  - "hot sale"

# Danh mục từ khóa rủi ro
categories:
  safety:
    - pattern: "overheat"
      canonical: "overheat"
    - pattern: "overheating"
      canonical: "overheat"
    - pattern: "overheated"
      canonical: "overheat"
    - pattern: "burning smell"
      canonical: "burning smell"
    - pattern: "burn smell"
      canonical: "burning smell"
    - pattern: "caught fire"
      canonical: "caught fire"
    - pattern: "catch fire"
      canonical: "caught fire"
    - pattern: "catches fire"
      canonical: "caught fire"
    - pattern: "burst into flames"
      canonical: "caught fire"
    - pattern: "fire hazard"
      canonical: "fire hazard"
    - pattern: "exploded"
      canonical: "exploded"
    - pattern: "explode"
      canonical: "exploded"
    - pattern: "electric shock"
      canonical: "electric shock"
    - pattern: "sparking"
      canonical: "sparking"

  health:
    - pattern: "rash"
      canonical: "rash"
    - pattern: "rashes"
      canonical: "rash"
    - pattern: "allergic"
      canonical: "allergic"
    - pattern: "allergy"
      canonical: "allergic"
    - pattern: "toxic"
      canonical: "toxic"
    - pattern: "injury"
      canonical: "injury"
    - pattern: "injuries"
      canonical: "injury"
    - pattern: "chemical burn"
      canonical: "injury"
    - pattern: "choking hazard"
      canonical: "choking hazard"
    - pattern: "poisonous"
      canonical: "toxic"

  counterfeit:
    - pattern: "fake"
      canonical: "fake"
    - pattern: "counterfeit"
      canonical: "fake"
    - pattern: "knockoff"
      canonical: "fake"

  legal:
    - pattern: "recall"
      canonical: "recall"
    - pattern: "recalled"
      canonical: "recall"
    - pattern: "lawsuit"
      canonical: "lawsuit"
    - pattern: "class action"
      canonical: "lawsuit"
