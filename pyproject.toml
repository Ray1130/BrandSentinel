[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brandsentinel"
version = "0.1.0"
description = "Early warning system for product-quality crises from e-commerce reviews"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0",
  "pyarrow>=15",
  "pandera[polars]>=0.20",
  "pydantic>=2.6",
  "pyyaml>=6",
  "numpy>=1.26",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "ruptures>=1.1.9",
  "pymannkendall>=1.4",
  "typer>=0.12",
]

# Cài thêm khi cần: uv sync --extra nlp   (nặng, cần torch - chỉ P3 cần ở giai đoạn đầu)
[project.optional-dependencies]
nlp = [
  "sentence-transformers>=3.0",
  "transformers>=4.40",
  "torch",
  "underthesea>=6.8",
  "bertopic>=0.16",
]
llm = ["httpx>=0.27"]
serving = ["fastapi>=0.110", "uvicorn>=0.29", "streamlit>=1.35"]

[project.scripts]
bs = "brandsentinel.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "poethepoet>=0.27",
  "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/brandsentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Thay cho Makefile (không dùng được trên Windows): chạy bằng `uv run poe <task>`
[tool.poe.env]
PYTHONUTF8 = "1"

[tool.poe.tasks]
test = "pytest"
lint = "ruff check ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."
check = ["lint", "fmt-check", "test"]
scaffold = "python scripts/scaffold.py"
